[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "single-index-icl"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "jax",
    "numpy",
]

[tool.setuptools]
py-modules = ["single_index_icl"]
package-dir = {"" = "src"}

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
